# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/hyperlocal
spring.datasource.username=postgres
spring.datasource.password=gsoc_2027
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
# 'update' tells Hibernate to create/update tables based on your Java entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL - This prints the generated SQL to your console so you can see the magic happening
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true